parameters:
  displayName: 'Terraform Init'
  backendServiceArm: 'terraform-spn-akspipeline'

steps:
  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: 'latest'

  - script: |
      git config --global url."https://${BITBUCKET_USERNAME}:${BITBUCKET_APP_PASSWORD}@bitbucket.org/".insteadOf "https://bitbucket.org/"
    displayName: 'Inject Bitbucket Credentials into Git Config'
    env:
      BITBUCKET_USERNAME: $(BB_USERNAME)
      BITBUCKET_APP_PASSWORD: $(BB_PAT)

  - task: TerraformTaskV4@4
    displayName: ${{ parameters.displayName }}
    inputs:
      provider: 'azurerm'
      command: 'init'
      backendServiceArm: ${{ parameters.backendServiceArm }}
      backendAzureRmResourceGroupName: 'NEWRG'
      backendAzureRmStorageAccountName: 'azurekssvc21'
      backendAzureRmContainerName: 'terraformstate'
      backendAzureRmKey: 'terraform.tfstate'
