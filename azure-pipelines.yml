trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: bitbucket-auth  # Contains BITBUCKET_USERNAME and BITBUCKET_APP_PASSWORD
  - name: destroy_initiate
    value: 'false'         # Toggle to 'true' to enable destroy stage

stages:
  - stage: TerraformInit
    displayName: 'Terraform Init'
    jobs:
      - job: Init
        displayName: 'Initialize Terraform'
        steps:
           - template: .pipelines/templates/terraform-init.yml

          - script: |
              git config --global url."https://${BITBUCKET_USERNAME}:${BITBUCKET_APP_PASSWORD}@bitbucket.org/".insteadOf "https://bitbucket.org/"
            displayName: 'Configure Bitbucket Git'
            env:
              BITBUCKET_USERNAME: $(BITBUCKET_USERNAME)
              BITBUCKET_APP_PASSWORD: $(BITBUCKET_APP_PASSWORD)

  - stage: TerraformValidate
    displayName: 'Terraform Validate'
    dependsOn: TerraformInit
    jobs:
      - job: Validate
        displayName: 'Validate Terraform Files'
        steps:
          - template: .pipelines/templates/terraform-init.yml
          - task: TerraformTaskV4@4
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'

  - stage: TerraformPlan
    displayName: 'Terraform Plan'
    dependsOn: TerraformValidate
    jobs:
      - job: Plan
        displayName: 'Plan Terraform Deployment'
        steps:
          - template: .pipelines/templates/terraform-init.yml
          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'

  - stage: TerraformApply
    displayName: 'Terraform Apply'
    dependsOn: TerraformPlan
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
    jobs:
      - deployment: Apply
        displayName: 'Apply Infrastructure Changes'
        environment: 'prod'  # ✅ Add approval rule in DevOps Environments > prod
        strategy:
          runOnce:
            deploy:
              steps:
                - template: .pipelines/templates/terraform-init.yml
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply with Auto-Approve'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    args: '-auto-approve'

  - stage: TerraformDestroy
    displayName: 'Terraform Destroy'
    dependsOn: TerraformApply
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'), eq(variables['destroy_initiate'], 'true'))
    jobs:
      - deployment: Destroy
        displayName: 'Destroy Infrastructure'
        environment: 'prod'  # ✅ Add approval rule in DevOps Environments > prod
        strategy:
          runOnce:
            deploy:
              steps:
                - template: .pipelines/templates/terraform-init.yml
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Destroy with Auto-Approve'
                  inputs:
                    provider: 'azurerm'
                    command: 'destroy'
                    args: '-auto-approve'
