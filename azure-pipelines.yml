trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: bitbucket-auth  # BITBUCKET_USERNAME and BITBUCKET_APP_PASSWORD stored securely
  - name: destroy_initiate
    value: 'false'         # Change to 'true' to activate destroy stage

stages:
  - stage: TerraformInit
    displayName: 'Terraform Init'
    jobs:
      - job: Init
        displayName: 'Initialize Terraform'
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - script: |
              git config --global url."https://${BITBUCKET_USERNAME}:${BITBUCKET_APP_PASSWORD}@bitbucket.org/".insteadOf "https://bitbucket.org/"
            displayName: 'Configure Git for Bitbucket access'
            env:
              BITBUCKET_USERNAME: $(BITBUCKET_USERNAME)
              BITBUCKET_APP_PASSWORD: $(BITBUCKET_APP_PASSWORD)

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init with Backend'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'Prod(202d4be6-e0dd-49be-84b7-e25d532f318a)'
              backendAzureRmResourceGroupName: 'NEWRG'
              backendAzureRmStorageAccountName: 'azurekssvc'
              backendAzureRmContainerName: 'terraform'
              backendAzureRmKey: 'terraform.tfstate'

  - stage: TerraformValidate
    displayName: 'Terraform Validate'
    dependsOn: TerraformInit
    jobs:
      - job: Validate
        steps:
          - task: TerraformTaskV4@4
            displayName: 'Validate Configuration'
            inputs:
              provider: 'azurerm'
              command: 'validate'

  - stage: TerraformPlan
    displayName: 'Terraform Plan'
    dependsOn: TerraformValidate
    jobs:
      - job: Plan
        steps:
          - task: TerraformTaskV4@4
            displayName: 'Plan Deployment'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'Prod(202d4be6-e0dd-49be-84b7-e25d532f318a)'

  - stage: TerraformApply
    displayName: 'Terraform Apply'
    dependsOn: TerraformPlan
    condition: succeeded()
    environment: 'prod'  # 🔐 Manual approval required via Azure DevOps environment
    jobs:
      - job: Apply
        displayName: 'Apply Infrastructure Changes'
        steps:
          - task: TerraformTaskV4@4
            displayName: 'Apply with Auto-Approve'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'Prod(202d4be6-e0dd-49be-84b7-e25d532f318a)'
              args: '-auto-approve'

  - stage: TerraformDestroy
    displayName: 'Terraform Destroy'
    dependsOn: TerraformApply
    condition: and(succeeded(), eq(variables['destroy_initiate'], 'true'))
    environment: 'prod'  # 🔐 Manual approval required via Azure DevOps environment
    jobs:
      - job: Destroy
        displayName: 'Destroy Infrastructure'
        steps:
          - task: TerraformTaskV4@4
            displayName: 'Destroy with Auto-Approve'
            inputs:
              provider: 'azurerm'
              command: 'destroy'
              environmentServiceNameAzureRM: 'Prod(202d4be6-e0dd-49be-84b7-e25d532f318a)'
              args: '-auto-approve'
